name: Build r3dfox (Windows)

on:
  push        # every commit, all branches
  pull_request
  workflow_dispatch

jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Git
        run: choco install git --yes

      - name: Install MozillaBuild
        run: choco install mozillabuild --yes

      - name: Install Rustup
        run: choco install rustup.install --yes

      - name: Install 7-Zip
        run: choco install 7zip --yes

      - name: Download and Extract eRust
        shell: powershell
        run: |
          $url = "https://github.com/Eclipse-Community/eRust/releases/download/e1.85.1/eRust-1.85.1.7z"
          $out = "$env:USERPROFILE\\Downloads\\eRust.7z"
          Invoke-WebRequest -Uri $url -OutFile $out
          & "C:\\Program Files\\7-Zip\\7z.exe" x $out -oC:\\eRust-1.85.1 -y

      - name: Link eRust toolchain
        shell: bash
        run: |
          rustup toolchain link eRust-1.85.1 C:/eRust-1.85.1
          rustup default eRust-1.85.1

      - name: Adjust Rust toolchains
        shell: bash
        run: |
          rustup install 1.85.1
          rustup toolchain remove stable

      - name: Bootstrap
        shell: bash
        run: ./mach --no-interactive bootstrap --application browser

  build:
    runs-on: windows-latest
    needs: bootstrap   # 👈 ensures fresh runner after bootstrap
    strategy:
      matrix:
        arch: [x86, x64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Git
        run: choco install git --yes
      - name: Install MozillaBuild
        run: choco install mozillabuild --yes
      - name: Install Rustup
        run: choco install rustup.install --yes
      - name: Install 7-Zip
        run: choco install 7zip --yes

      - name: Download and Extract eRust
        shell: powershell
        run: |
          $url = "https://github.com/Eclipse-Community/eRust/releases/download/e1.85.1/eRust-1.85.1.7z"
          $out = "$env:USERPROFILE\\Downloads\\eRust.7z"
          Invoke-WebRequest -Uri $url -OutFile $out
          & "C:\\Program Files\\7-Zip\\7z.exe" x $out -oC:\\eRust-1.85.1 -y

      - name: Link eRust toolchain (override after bootstrap)
        shell: bash
        run: |
          rustup toolchain link eRust-1.85.1 C:/eRust-1.85.1
          rustup override set eRust-1.85.1

      - name: Build and Package
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            export MOZCONFIG=$GITHUB_WORKSPACE/mozconfigs/mozconfig-win-x64
          else
            export MOZCONFIG=$GITHUB_WORKSPACE/mozconfigs/mozconfig-win-x86
          fi
          ./mach build
          ./mach package

      - name: Upload r3dfox artifact
        uses: actions/upload-artifact@v4
        with:
          name: r3dfox-${{ matrix.arch }}
          path: ${{ github.workspace }}/obj-${{ matrix.arch }}/dist/firefox/*
